name: Frontend Lint, Format & Build

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "package-lock.json"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "package-lock.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # creates a unique group; for example, "Commitlint-refs/heads/main"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # prevents cancellations on deployments to main

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Biome Check & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Biome CI
        run: npm run ci --workspace=frontend

      - name: Verify Vite Build
        run: npm run build --workspace=frontend
